selectors:
  - name: cap_mg_khung
    description: "Selector kiểm tra khung project (KAT tests)"
    definition:
      method: path
      value: tests/khung

  - name: cap_mg_staging
    description: "Tầng staging; bỏ test raw vault, Gold đọc cả staging (vd test_raw_completeness, test của dq_mg_daily), vì chạy trước khi các tầng đó được dựng"
    definition:
      union:
        - method: tag
          value: staging
        - exclude:
            - method: tag
              value: dv_raw
            - method: tag
              value: gold

  - name: cap_mg_raw
    description: "Tầng Raw Vault; bỏ test Business Vault đọc cả raw vault (vd test_bv_ptr), vì chạy trước khi BV được dựng"
    definition:
      union:
        - method: tag
          value: dv_raw
        - exclude:
            - method: tag
              value: dv_bv
            - method: tag
              value: gold

  - name: cap_mg_bv
    description: "Tầng Business Vault; bỏ test Gold đọc cả BV (vd test_gold_vault_totals), vì chạy trước khi Gold của D được dựng"
    definition:
      union:
        - method: tag
          value: dv_bv
        - exclude:
            - method: tag
              value: gold

  - name: cap_mg_asof
    description: "Tầng As-of; bỏ test BV, Gold (view as-of cần GUC của phiên, test của các tầng đó chạy ở selector của chúng)"
    definition:
      union:
        - method: tag
          value: asof
        - exclude:
            - method: tag
              value: dv_bv
            - method: tag
              value: gold

  - name: cap_mg_gold
    description: "Tầng Gold"
    definition:
      method: tag
      value: gold

  - name: cap_mg_all
    description: "Toàn bộ pipeline CAP-MG"
    definition:
      union:
        - method: tag
          value: staging
        - method: tag
          value: dv_raw
        - method: tag
          value: dv_bv
        - method: tag
          value: asof
        - method: tag
          value: gold
        - method: path
          value: tests/khung
