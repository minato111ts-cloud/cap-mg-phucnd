name: 'cap_mg'
version: '1.0.0'
config-version: 2

require-dbt-version: [">=1.12.0", "<2.0.0"]

profile: 'cap_mg'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

vars:
  gold_ready_local_time: "06:00"

models:
  cap_mg:
    staging:
      +schema: staging
      +materialized: view
      +tags: ["staging"]
    atomic:
      raw:
        +schema: atomic
        +materialized: incremental
        +incremental_strategy: append
        +on_schema_change: fail
        +tags: ["dv_raw"]
      bv:
        +schema: atomic
        +materialized: incremental
        +incremental_strategy: append
        +tags: ["dv_bv"]
    asof:
      +schema: asof
      +materialized: view
      +tags: ["asof"]
    gold:
      +schema: mart
      +materialized: incremental
      +incremental_strategy: append
      +tags: ["gold"]
