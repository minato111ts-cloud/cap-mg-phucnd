name: 'cap_mg'
version: '1.0.0'
config-version: 2

require-dbt-version: [">=1.12.0", "<2.0.0"]

profile: 'cap_mg'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

vars:
  gold_ready_local_time: "06:00"
  # Ngưỡng nghiệp vụ (INV-M6): phải bằng customers/ctcka/thresholds.yaml,
  # test tests/loader test_thresholds_sync_with_dbt_vars chặn lệch. Runner có thể ghi đè qua --vars.
  event_future_tolerance_minutes: 5

seeds:
  cap_mg:
    # Danh mục ref/ của gói đề: đọc bằng ref(), không nạp vào landing (landing chỉ chứa lô theo manifest)
    +schema: staging
    +tags: ["staging"]
    +quote_columns: false
    +column_types:
      calendar_date: date
      is_trading_day: integer

models:
  cap_mg:
    staging:
      +schema: staging
      +materialized: view
      +tags: ["staging"]
    atomic:
      raw:
        +schema: atomic
        +materialized: incremental
        +incremental_strategy: append
        +on_schema_change: fail
        +tags: ["dv_raw"]
      bv:
        +schema: atomic
        +materialized: incremental
        +incremental_strategy: append
        +tags: ["dv_bv"]
    asof:
      +schema: asof
      +materialized: view
      +tags: ["asof"]
    gold:
      +schema: mart
      +materialized: incremental
      +incremental_strategy: append
      +tags: ["gold"]
