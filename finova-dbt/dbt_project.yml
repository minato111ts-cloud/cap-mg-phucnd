name: 'cap_mg'
version: '1.0.0'
config-version: 2

require-dbt-version: [">=1.12.0", "<2.0.0"]

profile: 'cap_mg'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

# Hàm đọc cutoff của phiên cho view as-of (macros/asof/asof.sql). Chỉ tạo hàm ở đây; GUC đặt trên connection
# của từng model BV, Gold (on-run-start chỉ chạy trên một connection, E.8).
on-run-start:
  - "{{ asof_create_function('cutoff', 'finova.asof_cutoff', 'timestamptz') }}"
  - "{{ asof_create_function('as_of_date', 'finova.asof_date', 'date') }}"

vars:
  gold_ready_local_time: "06:00"
  # Ngưỡng nghiệp vụ (INV-M6): phải bằng customers/ctcka/thresholds.yaml,
  # test test_thresholds_in_sync_with_dbt_vars chặn lệch. Runner có thể ghi đè qua --vars.
  event_future_tolerance_minutes: 5
  # Role đọc Gold có RLS (setup/bootstrap.sql, DEC-CAP-MG-RLSROLE)
  gold_reader_role: finova_app

seeds:
  cap_mg:
    # Danh mục ref/ của gói đề: đọc bằng ref(), không nạp vào landing (landing chỉ chứa lô theo manifest)
    +schema: staging
    +tags: ["staging"]
    +quote_columns: false
    +column_types:
      calendar_date: date
      is_trading_day: integer

models:
  cap_mg:
    staging:
      +schema: staging
      +materialized: view
      +tags: ["staging"]
    atomic:
      raw:
        +schema: atomic
        +materialized: incremental
        +incremental_strategy: append
        +on_schema_change: fail
        +tags: ["dv_raw"]
      bv:
        +schema: atomic
        +materialized: incremental
        +incremental_strategy: append
        +on_schema_change: fail
        +tags: ["dv_bv"]
        # T-BV, QT-DAY-REBUILD: đặt GUC của ngày D trên connection của model, rồi xóa phần của D
        +pre-hook:
          - "{{ asof_session() }}"
          - "{{ asof_day_delete() }}"
    asof:
      +schema: asof
      +materialized: view
      +tags: ["asof"]
    gold:
      +schema: mart
      +materialized: incremental
      +incremental_strategy: append
      +on_schema_change: fail
      +tags: ["gold"]
      # T-GOLD-DAY (E.8): cùng cơ chế với T-BV; không vật hóa table (REQ-SEM-NOTABLE: policy RLS phụ thuộc bảng)
      +pre-hook:
        - "{{ asof_session() }}"
        - "{{ asof_day_delete() }}"
